<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auroraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="rayGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background shape -->
  <rect width="512" height="512" rx="112" fill="url(#auroraBg)" />

  <!-- Soft ambient radiance -->
  <circle cx="256" cy="280" r="160" fill="url(#sunGlow)" opacity="0.2" filter="url(#glow)" />

  <!-- Sun rays (geometric calm lines) -->
  <g stroke="url(#rayGlow)" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="90" x2="256" y2="140" />
    <line x1="130" y1="160" x2="168" y2="198" />
    <line x1="382" y1="160" x2="344" y2="198" />
    <line x1="80" y1="280" x2="130" y2="280" />
    <line x1="432" y1="280" x2="382" y2="280" />
  </g>

  <!-- Horizon Arch & Rising Sun -->
  <ellipse cx="256" cy="300" rx="90" ry="90" fill="url(#sunGlow)" filter="url(#glow)" />
  <ellipse cx="256" cy="300" rx="84" ry="84" fill="url(#sunGlow)" />

  <!-- Mountain / Horizon silhouette arc -->
  <path d="M 120 370 Q 256 320 392 370 L 400 420 Q 256 420 112 420 Z" fill="#0f172a" opacity="0.95" />
  <path d="M 140 375 Q 256 335 372 375" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none" />

  <!-- Dawn Star / Focus Sparkle -->
  <path d="M 256 220 L 262 238 L 280 244 L 262 250 L 256 268 L 250 250 L 232 244 L 250 238 Z" fill="#ffffff" />
</svg>
